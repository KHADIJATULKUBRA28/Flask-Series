<!-- Modal for Selling Confirmation -->
<div class="modal fade" id="Modal-SellingConfirm-{{ owned_item.id }}" tabindex="-1" role="dialog" aria-labelledby="SellingConfirmModalLabel-{{ owned_item.id }}" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title" id="SellingConfirmModalLabel-{{ owned_item.id }}">Sell Confirmation</h5>
                <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to sell <strong>{{ owned_item.name }}</strong> back to the market for <strong>{{ owned_item.price }}$</strong>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <form method="POST" style="display: inline;">
                    {{ selling_form.hidden_tag() }}
                    <input type="hidden" name="sold_item" value="{{ owned_item.name }}">
                    {{ selling_form.submit(class="btn btn-danger") }}
                </form>
            </div>
        </div>
    </div>
</div>
